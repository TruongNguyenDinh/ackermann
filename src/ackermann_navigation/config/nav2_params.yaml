bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
controller_server:
  ros__parameters:
    # Giữ 20 Hz + model_dt 0.05 như bản cũ: vòng điều khiển dày, bám path tốt hơn
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 15.0
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # Keep the original horizon to avoid increasing MPPI compute cost.
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.0
      # TỐI ƯU: 0.4 -> 0.25. Ackermann bị giới hạn wz <= vx/min_turning_r (~0.19 rad/s),
      # std 0.4 làm đa số mẫu bị cắt về giới hạn nên thiếu đa dạng.
      wz_std: 0.25
      vx_max: 0.26
      vx_min: -0.26
      vy_max: 0.0
      # At vx_max, this is bounded by the 1.3453 m minimum turning radius.
      wz_max: 0.19
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"
      visualize: false
      AckermannConstraints:
        # 15 deg inner-wheel limit: L/tan(delta) + front_track/2.
        min_turning_r: 1.3453
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        # Smac Hybrid (Reeds-Shepp) có đoạn lùi: tôn trọng hướng của path
        # để MPPI không chọn chiều ngược lại.
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      # TỐI ƯU: 3 -> 4 m để phủ hết quỹ đạo MPPI (~0.83 m) cộng footprint
      width: 4
      height: 4
      resolution: 0.05
      # Estimated outline relative to rear-axle base_footprint; synchronize
      # with Xacro dimensions after measuring the drawing endpoints.
      footprint: "[[0.3817, 0.181], [0.2557, 0.181], [0.2526, 0.119], [0.2026, 0.090], [0.1161, 0.090], [0.0661, 0.119], [0.0630, 0.181], [-0.0630, 0.181], [-0.0630, -0.181], [0.0630, -0.181], [0.0661, -0.119], [0.1161, -0.090], [0.2026, -0.090], [0.2526, -0.119], [0.2557, -0.181], [0.3817, -0.181]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.3817, 0.181], [0.2557, 0.181], [0.2526, 0.119], [0.2026, 0.090], [0.1161, 0.090], [0.0661, 0.119], [0.0630, 0.181], [-0.0630, 0.181], [-0.0630, -0.181], [0.0630, -0.181], [0.0661, -0.119], [0.1161, -0.090], [0.2026, -0.090], [0.2526, -0.119], [0.2557, -0.181], [0.3817, -0.181]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

map_server:
  ros__parameters:
    # Overridden in launch by the "map" launch configuration or provided default value.
    yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    # Both Ackermann behavior trees refresh paths every 5 seconds.
    expected_planner_frequency: 0.2
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.05
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      # TỐI ƯU: 5.0 -> 2.0 để path không bị cũ so với vị trí xe (0.26 m/s * 5 s = 1.3 m)
      max_planning_time: 2.0
      # Khôi phục REEDS_SHEPP: cho phép lùi nên quãng đường ngắn hơn nhiều
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      # Add planner margin for lattice discretization: live plans measured
      # about 1.18 m versus the 1.345 m geometric steering limit.
      minimum_turning_radius: 1.55
      # Ưu tiên đi tiến, vẫn cho phép lùi khi cần
      reverse_penalty: 2.0
      # Hạn chế đổi chiều tiến/lùi không cần thiết
      # Penalize repeated forward/reverse gear changes on near-goal paths.
      # Avoid unnecessary forward/reverse cusps on short goal approaches.
      change_penalty: 5.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      # Smooth lattice jaggies before MPPI tracks the path; the planner radius
      # includes margin above the measured Ackermann minimum.
      smooth_path: true
      smoother:
        max_iterations: 100
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 0.19]
    min_velocity: [-0.26, 0.0, -0.19]
    max_accel: [2.5, 0.0, 0.8]
    max_decel: [-2.5, 0.0, -0.8]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
